<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Public repository search</title>
<style>
:root{--bg:#f7f7f5;--ink:#1d2321;--muted:#56625e;--line:#cdd4d0;--card:#fff;--focus:#0b57d0;--err:#a4161a;--errbg:#fdecec;--load:#0b57d0;--loadbg:#e9f0fd;--none:#5a4a00;--nonebg:#fff6d6}
@media (prefers-color-scheme:dark){:root{--bg:#141817;--ink:#eef2f0;--muted:#a9b6b1;--line:#35403c;--card:#1d2321;--focus:#8ab4ff;--err:#ff9a9d;--errbg:#3a1618;--load:#8ab4ff;--loadbg:#18263f;--none:#f3dc7a;--nonebg:#38320f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;overflow-wrap:anywhere}
main{max-width:46rem;margin:0 auto;padding:1rem}
h1{font-size:clamp(1.5rem,5vw,2.1rem);margin:.5rem 0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
form{display:flex;gap:.5rem;flex-wrap:wrap}
label{display:block;font-weight:600;width:100%}
input[type=search]{flex:1 1 12rem;min-width:0}
input,button{font:inherit;min-height:44px;padding:.4rem .8rem;border:2px solid var(--ink);border-radius:.5rem;background:var(--card);color:var(--ink)}
button{cursor:pointer;font-weight:600}
button.primary{background:var(--ink);color:var(--bg)}
details{margin:1rem 0;border:1px solid var(--line);border-radius:.5rem;padding:.5rem .75rem;background:var(--card)}
summary{cursor:pointer;font-weight:600}
.demo{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.5rem}
.state{margin:1rem 0;padding:1rem;border-radius:.5rem;border:2px solid;display:flex;gap:.75rem;align-items:flex-start}
.state h2{margin:0 0 .25rem;font-size:1.1rem}.state p{margin:.25rem 0}
.state .ic{font-size:1.5rem;line-height:1.2}
.loading{border-color:var(--load);background:var(--loadbg);border-style:dashed}
.error{border-color:var(--err);background:var(--errbg)}
.empty{border-color:var(--none);background:var(--nonebg);border-style:dotted}
.spin{width:1.4rem;height:1.4rem;border:3px solid var(--load);border-right-color:transparent;border-radius:50%;flex:none;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
ul.res{list-style:none;margin:1rem 0;padding:0;display:grid;gap:.6rem}
.res li{background:var(--card);border:1px solid var(--line);border-radius:.5rem;padding:.7rem .9rem}
.res a{font-weight:700;color:var(--focus)}
.res p{margin:.25rem 0;color:var(--muted)}
.meta{font-size:.9rem;color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>Public repository search</h1>
<form id="f" role="search">
 <label for="q">Search public GitHub repositories</label>
 <input id="q" type="search" placeholder="e.g. accessibility" autocomplete="off" required>
 <button class="primary" type="submit">Search</button>
</form>
<details>
 <summary>Reviewer: trigger each state</summary>
 <p class="meta">Each button runs the real search code path. No code edits needed.</p>
 <div class="demo">
  <button type="button" data-demo="loading">Show loading state</button>
  <button type="button" data-demo="error">Show error state</button>
  <button type="button" data-demo="empty">Show empty state</button>
 </div>
</details>
<div id="out" aria-live="polite" aria-atomic="false"></div>
</main>
<script>
const API="https://api.github.com/search/repositories";
const out=document.getElementById("out"),q=document.getElementById("q");
let ctl=null,last=null;
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html)e.innerHTML=html;return e}
function box(kind,icon,title,lines,retry){
 const b=el("div","state "+kind);if(kind==="error")b.setAttribute("role","alert");
 b.append(icon);
 const d=el("div");const h=el("h2");h.textContent=title;d.append(h);
 lines.forEach(t=>{const p=el("p");p.textContent=t;d.append(p)});
 if(retry){const r=el("button");r.type="button";r.textContent="Try again";r.onclick=()=>run(last.term,last.opts);d.append(r)}
 b.append(d);out.replaceChildren(b);
}
const sp=()=>{const s=el("span","spin");s.setAttribute("aria-hidden","true");return s};
const ic=c=>{const s=el("span","ic");s.setAttribute("aria-hidden","true");s.textContent=c;return s};
async function run(term,opts={}){
 last={term,opts};
 if(ctl)ctl.abort();ctl=new AbortController();
 box("loading",sp(),"Loading…",["Searching GitHub for “"+term+"”. This can take a few seconds."]);
 try{
  if(opts.delay)await new Promise(r=>setTimeout(r,opts.delay));
  const url=(opts.url||API)+"?per_page=10&q="+encodeURIComponent(term);
  const res=await fetch(url,{signal:ctl.signal,headers:{Accept:"application/vnd.github+json"}});
  if(res.status===403||res.status===429)
   return box("error",ic("✕"),"Request failed: search limit reached",["GitHub allows only a few searches per minute without signing in.","Wait about a minute, then press Try again."],true);
  if(res.status===422)
   return box("error",ic("✕"),"Request failed: GitHub could not read that search",["Remove special characters or shorten the search, then try again."],false);
  if(!res.ok)
   return box("error",ic("✕"),"Request failed: GitHub returned an error ("+res.status+")",["This is usually temporary. Press Try again in a moment."],true);
  const data=await res.json();
  if(!data.items.length)
   return box("empty",ic("∅"),"No repositories found",["The search worked, but no public repository matches “"+term+"”.","Try a broader word, check the spelling, or remove extra terms."],false);
  const ul=el("ul","res");
  data.items.forEach(r=>{
   const li=el("li"),a=el("a");a.href=r.html_url;a.textContent=r.full_name;a.rel="noopener";
   const p=el("p");p.textContent=r.description||"No description provided.";
   const m=el("span","meta");m.textContent="★ "+r.stargazers_count.toLocaleString()+(r.language?" · "+r.language:"");
   li.append(a,p,m);ul.append(li);
  });
  const h=el("h2");h.textContent="Showing "+data.items.length+" of "+data.total_count.toLocaleString()+" results for “"+term+"”";
  h.style.fontSize="1.1rem";out.replaceChildren(h,ul);
 }catch(e){
  if(e.name==="AbortError")return;
  box("error",ic("✕"),"Request failed: couldn't reach GitHub",["Check your internet connection, then press Try again."],true);
 }
}
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();const t=q.value.trim();if(t)run(t)});
document.querySelectorAll("[data-demo]").forEach(b=>b.addEventListener("click",()=>{
 const m=b.dataset.demo;
 if(m==="loading"){q.value=q.value.trim()||"accessibility";run(q.value,{delay:5000})}
 if(m==="error"){q.value=q.value.trim()||"accessibility";run(q.value,{url:"https://api.github.invalid/search/repositories"})}
 if(m==="empty"){q.value="zzqx-no-such-repo-8f3k2";run(q.value)}
}));
</script>
</body>
</html>
